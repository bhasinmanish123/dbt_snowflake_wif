# ============================================================
# dbt CI/CD — Single Repo (WIF OIDC) — SLIM CI
#
# SLIM CI: only builds CHANGED models on PR (not everything)
#   --select state:modified+   = changed models + their downstream
#   --defer                    = use prod manifest for unchanged models
#   --state /tmp/prod-state    = compare against prod manifest
#
# FLOW:
#   PR:    lint → download prod manifest → dbt build CHANGED only
#   Merge: dbt build ALL → upload fresh manifest as artifact
# ============================================================
name: dbt CI/CD (WIF)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    if: github.event_name == 'pull_request'
    name: Lint YAML + SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: pip install yamllint sqlfluff
      - name: YAML Lint
        run: yamllint -c .yamllint.yml dbt_project.yml profiles.yml
      - name: SQL Lint
        run: sqlfluff lint models/ --dialect snowflake --ignore templating

  build-ci:
    if: github.event_name == 'pull_request'
    name: dbt build → DEV_${{ github.actor }} (changed only)
    needs: [lint]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake (WIF)
        uses: ./.github/actions/setup-snowflake
        with:
          environment: ci
          snowflake-account: ${{ secrets.SNOWFLAKE_ACCOUNT }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      # Download prod manifest (uploaded by CD job after each prod deploy)
      # This is the "state" to compare against
      - name: Download prod manifest (state)
        uses: actions/download-artifact@v4
        with:
          name: prod-manifest
          path: /tmp/prod-state
        continue-on-error: true    # first run ever = no artifact yet, that's ok

      - name: Check prod state available
        run: |
          if [ -f /tmp/prod-state/manifest.json ]; then
            echo "SLIM_CI=true" >> $GITHUB_ENV
            echo "✅ Prod manifest found — Slim CI: only changed models will build"
          else
            echo "SLIM_CI=false" >> $GITHUB_ENV
            echo "⚠️ No prod manifest yet — building all models (first run)"
          fi

      # Slim CI: only build changed models + downstream
      - name: dbt build → changed models only
        run: |
          if [ "$SLIM_CI" = "true" ]; then
            dbt build --target ci \
              --select state:modified+ \
              --defer \
              --state /tmp/prod-state
          else
            dbt build --target ci
          fi

  # ============================================================
  # CD: full build to PROD + upload manifest as artifact
  # ============================================================
  deploy-prod:
    if: github.event_name == 'push'
    name: dbt build → PROD
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake (WIF)
        uses: ./.github/actions/setup-snowflake
        with:
          environment: prod
          snowflake-account: ${{ secrets.SNOWFLAKE_ACCOUNT }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      - name: dbt build → PROD (full build)
        run: dbt build --target prod

      # Upload manifest so CI jobs can use it for Slim CI
      - name: Upload prod manifest as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prod-manifest
          path: target/manifest.json
          retention-days: 30        # keep for 30 days
