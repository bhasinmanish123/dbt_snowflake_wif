# ============================================================
# dbt CI/CD — Single Repo (WIF OIDC)
#
# FLOW:
#   PR to main:
#     1. Lint (YAML + SQL)
#     2. setup-snowflake → WIF token
#     3. Restore manifest cache → partial parsing
#     4. dbt build --target ci → DEV_<github_username>
#     5. Save manifest cache
#
#   Merge to main:
#     1. setup-snowflake → WIF token
#     2. Restore manifest cache → partial parsing
#     3. dbt build --target prod → PROD
#     4. Save manifest cache
#
# SECRETS NEEDED (1 only):
#   SNOWFLAKE_ACCOUNT = ixxaxho-kv48866
#
# GITHUB ENVIRONMENT NEEDED:
#   prod  (Settings → Environments → New: prod)
# ============================================================
name: dbt CI/CD (WIF)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  # ============================================================
  # CI: on Pull Request — lint + build personal DEV schema
  # ============================================================

  lint:
    if: github.event_name == 'pull_request'
    name: Lint YAML + SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: pip install yamllint sqlfluff
      - name: YAML Lint
        run: yamllint -c .yamllint.yml dbt_project.yml profiles.yml
      - name: SQL Lint
        run: sqlfluff lint models/ --dialect snowflake --ignore templating

  build-ci:
    if: github.event_name == 'pull_request'
    name: dbt build → DEV_${{ github.actor }}
    needs: [lint]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake (WIF)
        uses: ./.github/actions/setup-snowflake
        with:
          environment: ci
          snowflake-account: ${{ secrets.SNOWFLAKE_ACCOUNT }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      # Restore cached manifest from previous run → enables partial parsing
      # Use head_ref (branch name) for PRs, ref_name for pushes
      - name: Restore dbt manifest cache
        uses: actions/cache/restore@v4
        with:
          path: target/manifest.json
          key: dbt-manifest-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            dbt-manifest-${{ github.head_ref || github.ref_name }}-
            dbt-manifest-main-

      - name: dbt build → DEV_${{ github.actor }}
        run: dbt build --target ci

      # Save manifest after successful build for next run
      - name: Save dbt manifest cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: target/manifest.json
          key: dbt-manifest-${{ github.head_ref || github.ref_name }}-${{ github.sha }}

  # ============================================================
  # CD: on merge to main — deploy to PROD
  # ============================================================

  deploy-prod:
    if: github.event_name == 'push'
    name: dbt build → PROD
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake (WIF)
        uses: ./.github/actions/setup-snowflake
        with:
          environment: prod
          snowflake-account: ${{ secrets.SNOWFLAKE_ACCOUNT }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      # Restore manifest from main branch cache
      - name: Restore dbt manifest cache
        uses: actions/cache/restore@v4
        with:
          path: target/manifest.json
          key: dbt-manifest-main-${{ github.sha }}
          restore-keys: |
            dbt-manifest-main-

      - name: dbt build → PROD
        run: dbt build --target prod

      # Save manifest after prod deploy
      - name: Save dbt manifest cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: target/manifest.json
          key: dbt-manifest-main-${{ github.sha }}
