# ============================================================
# dbt CI/CD — Single Repo (WIF OIDC)
# ============================================================
name: dbt CI/CD (WIF)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    if: github.event_name == 'pull_request'
    name: Lint YAML + SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: pip install yamllint sqlfluff
      - name: YAML Lint
        run: yamllint -c .yamllint.yml dbt_project.yml profiles.yml
      - name: SQL Lint
        run: sqlfluff lint models/ --dialect snowflake --ignore templating

  build-ci:
    if: github.event_name == 'pull_request'
    name: dbt build → DEV_${{ github.actor }}
    needs: [lint]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake (WIF)
        uses: ./.github/actions/setup-snowflake
        with:
          environment: ci
          snowflake-account: ${{ secrets.SNOWFLAKE_ACCOUNT }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      # Restore AFTER deps so deps doesn't wipe target/
      # No SHA in key — same branch always hits same cache entry
      - name: Restore dbt manifest cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: target/manifest.json
          key: dbt-manifest-${{ github.head_ref }}
          restore-keys: dbt-manifest-main

      - name: Check manifest exists
        run: |
          if [ -f target/manifest.json ]; then
            echo "✅ manifest.json found — partial parse will run"
            ls -lh target/manifest.json
          else
            echo "❌ manifest.json NOT found — full parse will run"
          fi

      - name: dbt build → DEV_${{ github.actor }}
        run: dbt build --target ci

      # Always save — overwrites old cache with fresh manifest
      - name: Save dbt manifest cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: target/manifest.json
          key: dbt-manifest-${{ github.head_ref }}-${{ github.run_id }}

  deploy-prod:
    if: github.event_name == 'push'
    name: dbt build → PROD
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake (WIF)
        uses: ./.github/actions/setup-snowflake
        with:
          environment: prod
          snowflake-account: ${{ secrets.SNOWFLAKE_ACCOUNT }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      - name: Restore dbt manifest cache
        uses: actions/cache/restore@v4
        with:
          path: target/manifest.json
          key: dbt-manifest-main
          restore-keys: dbt-manifest-main

      - name: dbt build → PROD
        run: dbt build --target prod

      - name: Save dbt manifest cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: target/manifest.json
          key: dbt-manifest-main-${{ github.run_id }}
