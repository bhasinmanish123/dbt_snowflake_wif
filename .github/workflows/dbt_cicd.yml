# ============================================================
# dbt CI/CD — Single Repo (WIF OIDC)
# Uses --state flag for partial parsing with explicit path
# ============================================================
name: dbt CI/CD (WIF)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    if: github.event_name == 'pull_request'
    name: Lint YAML + SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: pip install yamllint sqlfluff
      - name: YAML Lint
        run: yamllint -c .yamllint.yml dbt_project.yml profiles.yml
      - name: SQL Lint
        run: sqlfluff lint models/ --dialect snowflake --ignore templating

  build-ci:
    if: github.event_name == 'pull_request'
    name: dbt build → DEV_${{ github.actor }}
    needs: [lint]
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake (WIF)
        uses: ./.github/actions/setup-snowflake
        with:
          environment: ci
          snowflake-account: ${{ secrets.SNOWFLAKE_ACCOUNT }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      # Restore previous manifest into /tmp/dbt-state/ (separate from target/)
      # so dbt deps/clean cannot wipe it
      - name: Restore dbt state cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/dbt-state/manifest.json
          key: dbt-state-${{ github.head_ref }}
          restore-keys: dbt-state-main

      - name: Check state manifest
        run: |
          if [ -f /tmp/dbt-state/manifest.json ]; then
            echo "✅ state manifest found — partial parse enabled"
          else
            echo "⚠️ no state manifest — first run, full parse"
            mkdir -p /tmp/dbt-state
          fi

      - name: dbt build → DEV_${{ github.actor }}
        run: |
          if [ -f /tmp/dbt-state/manifest.json ]; then
            dbt build --target ci --state /tmp/dbt-state
          else
            dbt build --target ci
          fi

      # Copy fresh manifest to state folder for next run
      - name: Save state for next run
        if: success()
        run: cp target/manifest.json /tmp/dbt-state/manifest.json

      - name: Save dbt state cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: /tmp/dbt-state/manifest.json
          key: dbt-state-${{ github.head_ref }}-${{ github.run_id }}

  deploy-prod:
    if: github.event_name == 'push'
    name: dbt build → PROD
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake (WIF)
        uses: ./.github/actions/setup-snowflake
        with:
          environment: prod
          snowflake-account: ${{ secrets.SNOWFLAKE_ACCOUNT }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      - name: Restore dbt state cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/dbt-state/manifest.json
          key: dbt-state-main
          restore-keys: dbt-state-main

      - name: dbt build → PROD
        run: |
          if [ -f /tmp/dbt-state/manifest.json ]; then
            dbt build --target prod --state /tmp/dbt-state
          else
            dbt build --target prod
          fi

      - name: Save state for next run
        if: success()
        run: |
          mkdir -p /tmp/dbt-state
          cp target/manifest.json /tmp/dbt-state/manifest.json

      - name: Save dbt state cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: /tmp/dbt-state/manifest.json
          key: dbt-state-main-${{ github.run_id }}
