# ============================================================
# dbt CI/CD — Single Repo (WIF OIDC)
#
# Everything lives in THIS repo:
#   .github/actions/setup-snowflake/  ← composite action
#   .github/workflows/dbt_cicd.yml    ← this file
#   profiles.yml                      ← dbt connection
#   macros/generate_schema_name.sql   ← per-developer schema
#
# FLOW:
#   PR to main:
#     1. Lint (YAML + SQL)
#     2. setup-snowflake → WIF token
#     3. dbt build --target ci → DEV_<github_username>
#
#   Merge to main:
#     1. setup-snowflake → WIF token
#     2. dbt build --target prod → PROD
#
# SECRETS NEEDED (1 only):
#   SNOWFLAKE_ACCOUNT = ixxaxho-kv48866
#
# GITHUB ENVIRONMENT NEEDED:
#   prod  (Settings → Environments → New: prod)
# ============================================================
name: dbt CI/CD (WIF)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write      # required for OIDC token request
  contents: read

jobs:
  # ============================================================
  # CI: on Pull Request — lint + build personal DEV schema
  # ============================================================

  lint:
    if: github.event_name == 'pull_request'
    name: Lint YAML + SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters
        run: pip install yamllint sqlfluff
      - name: YAML Lint
        run: yamllint -c .yamllint.yml dbt_project.yml profiles.yml
      - name: SQL Lint
        run: sqlfluff lint models/ --dialect snowflake --ignore templating

  build-ci:
    if: github.event_name == 'pull_request'
    name: dbt build → DEV_${{ github.actor }}
    needs: [lint]
    runs-on: ubuntu-latest
    environment: prod                          # matches WIF SUBJECT
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
      GITHUB_ACTOR: ${{ github.actor }}        # → macro → DEV_USERNAME schema
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake (WIF)
        uses: ./.github/actions/setup-snowflake    # ← LOCAL action (same repo)
        with:
          environment: ci
          snowflake-account: ${{ secrets.SNOWFLAKE_ACCOUNT }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      - name: dbt build → DEV_${{ github.actor }}
        run: dbt build --target ci

  # ============================================================
  # CD: on merge to main — deploy to PROD
  # ============================================================

  deploy-prod:
    if: github.event_name == 'push'
    name: dbt build → PROD
    runs-on: ubuntu-latest
    environment: prod                          # matches WIF SUBJECT
    permissions:
      id-token: write
      contents: read
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup Snowflake (WIF)
        uses: ./.github/actions/setup-snowflake    # ← LOCAL action (same repo)
        with:
          environment: prod
          snowflake-account: ${{ secrets.SNOWFLAKE_ACCOUNT }}

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        run: dbt deps || true

      - name: dbt build → PROD
        run: dbt build --target prod
